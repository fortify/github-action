updates:
  minimumReleaseAgeDays: 7
  policies:
    ghes-upload:
      allowedMajors: [3]

parts:
  scan-steps: &scan-steps
    - name: Run Fortify AST Scan
      id: scan
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      x-repository-paths:
        FORTIFY_SETUP_BUNDLE: runtime/setup.cjs
      env:
        FORTIFY_DEBUG: ${{ inputs.debug }}
        GITHUB_TOKEN: ${{ github.token }}
      with:
        script: |
          const { runScan } = require(process.env.FORTIFY_SETUP_BUNDLE);
          await runScan(process.env.FORTIFY_DEBUG);
  github-upload: &github-upload
    name: Upload debug artifacts (github.com)
    if: ${{ always() && steps.scan.outputs.upload-debug-artifacts == 'true' }}
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
    with: &upload-inputs
      name: ${{ inputs.debug-artifact-name }}-${{ github.job }}
      path: ${{ steps.scan.outputs.debug-artifacts-dir }}
      retention-days: ${{ inputs.debug-retention-days }}
  ghes-upload: &ghes-upload
    name: Upload debug artifacts (GHES)
    if: ${{ always() && steps.scan.outputs.upload-debug-artifacts == 'true' }}
    x-update-policy: ghes-upload
    uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
    with: *upload-inputs
  artifact-inputs: &artifact-inputs
    debug-artifact-name:
      description: 'Name for the debug artifacts archive; defaults to "fortify-debug-artifacts"'
      required: false
      default: fortify-debug-artifacts
    debug-retention-days:
      description: 'Number of days to retain debug artifacts; defaults to 1 due to sensitivity of data'
      required: false
      default: '1'

outputs:
  without-artifacts/action.yml: &without-artifacts
    name: Fortify AST Scan (without artifacts)
    description: Run Fortify AST Scan without uploading debug artifacts; use this sub-action to implement a custom debug artifact upload mechanism.
    author: Fortify
    inputs: &scan-inputs
      debug:
        description: 'Whether to output debug artifacts; note that these may contain sensitive data like access tokens or credentials. Automatically enabled when workflow is re-run with "Enable debug logging" checked.'
        required: false
        default: 'false'
    outputs:
      upload-debug-artifacts:
        description: '"true" if debug artifacts should be uploaded (inputs.debug==true or runner.debug==1)'
        value: ${{ steps.scan.outputs.upload-debug-artifacts }}
      debug-artifacts-dir:
        description: Path to the debug artifacts directory (env.FORTIFY_DATA_DIR)
        value: ${{ steps.scan.outputs.debug-artifacts-dir }}
    runs:
      using: composite
      steps: *scan-steps

  with-github-artifacts/action.yml: &with-github-artifacts
    <<: *without-artifacts
    name: Fortify AST Scan (with GitHub artifacts)
    description: Run Fortify AST Scan and upload debug artifacts using actions/upload-artifact@v7 (GitHub.com).
    inputs:
      <<: [*scan-inputs, *artifact-inputs]
    outputs: {}
    branding:
      icon: shield
      color: blue
    runs:
      using: composite
      steps:
        - *scan-steps
        - *github-upload

  with-ghes-artifacts/action.yml:
    <<: *with-github-artifacts
    name: Fortify AST Scan (with GHES artifacts)
    description: Run Fortify AST Scan and upload debug artifacts using actions/upload-artifact@v3 (GHES-compatible).
    runs:
      using: composite
      steps:
        - *scan-steps
        - *ghes-upload

  action.yml: *with-github-artifacts

  setup/action.yml:
    name: Setup Fortify Tools
    description: Set up Fortify tools like fcli, ScanCentral Client, FoDUploader and FortifyVulnerabilityExporter
    author: Fortify
    inputs:
      export-path:
        description: 'Whether to add the installed tools to the system PATH variable. Allowed values: true (default) or false'
        default: 'true'
        required: false
      tool-definitions:
        description: 'Local or remote location of the Fortify yaml tool definitions zip-file. Can also be specified through TOOL_DEFINITIONS environment variable. Default value: https://github.com/fortify/tool-definitions/releases/download/v1/tool-definitions.yaml.zip'
        required: false
      fcli:
        description: 'The ScanCentral Client version to install. Allowed values: `skip` (default value, do not install), `latest`, or specific version number. Supports semantic versioning, for example `23.1` will install the latest known `23.1.y` patch version. Version may be specified either with or without the `v` prefix, for example `v23.1` and `23.1` are semantically the same.'
        default: skip
        required: false
      sc-client:
        description: 'The ScanCentral Client version to install. Allowed values: skip (default value, do not install), latest, or specific version number.'
        default: skip
        required: false
      fod-uploader:
        description: 'The FoDUploader version to install. Allowed values: `skip` (default value, do not install), `latest`, or specific version number. Supports semantic versioning, for example `v5` will install the latest known `5.x.y` version. Version may be specified either with or without the `v` prefix, for example `v5.4.0` and `5.4.0` are semantically the same.'
        default: skip
        required: false
      vuln-exporter:
        description: 'The FortifyVulnerabilityExporter version to install. Allowed values: `skip` (default value, do not install), `latest`, or specific version number. Supports semantic versioning, for example `v2` will install the latest known `2.x.y` version. Version may be specified either with or without the `v` prefix, for example `v2.0.4` and `2.0.4` are semantically the same.'
        default: skip
        required: false
      bugtracker-utility:
        description: 'The FortifyBugTrackerUtility version to install. Allowed values: `skip` (default value, do not install), `latest`, or specific version number. Supports semantic versioning, for example `v4` will install the latest known `4.x` version. Version may be specified either with or without the `v` prefix, for example `v4.12` and `4.12` are semantically the same.'
        default: skip
        required: false
      debricked-cli:
        description: 'The Debricked CLI version to install. Allowed values: `skip` (default value, do not install), `latest`, or specific version number. Supports semantic versioning, for example `v1` will install the latest known `1.x` version. Version may be specified either with or without the `v` prefix, for example `v1.7` and `1.7` are semantically the same.'
        default: skip
        required: false
    runs:
      using: node24
      main: ../runtime/setup.cjs
    branding:
      icon: shield
      color: blue