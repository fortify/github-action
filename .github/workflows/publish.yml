on:
  push:

permissions:
  contents: write
  pull-requests: write

name: Publish release
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out source code
        uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
      - name: Setup Node.js
        uses: fortify/shared-github/actions/3rdparty/actions/setup-node/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate committed action implementation
        run: |
          npm ci --prefix .github/tooling --ignore-scripts --no-audit --no-fund
          npm run check --prefix .github/tooling
          npm run typecheck --prefix .github/tooling
          npm test --prefix .github/tooling

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check-out source code
        uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554

      - name: Generate and process release PR
        id: release_please
        uses: fortify/shared-github/actions/3rdparty/googleapis/release-please-action/v5@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          release-type: simple
          target-branch: ${{ github.ref_name }}

      - name: Publish v{major}.{minor} tag
        if: steps.release_please.outputs.release_created
        uses: fortify/shared-github/actions/fortify/update-tag@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          tag_name: v${{steps.release_please.outputs.major}}.${{steps.release_please.outputs.minor}}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish v{major} tag
        if: steps.release_please.outputs.release_created
        uses: fortify/shared-github/actions/fortify/update-tag@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          tag_name: v${{steps.release_please.outputs.major}}
          github_token: ${{ secrets.GITHUB_TOKEN }}
